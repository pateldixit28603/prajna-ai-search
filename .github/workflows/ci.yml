name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t prajna .
      - name: Smoke test (container serves UI + API on $PORT)
        run: |
          docker run -d --name p -e PORT=10000 -p 10000:10000 prajna
          for i in $(seq 1 30); do curl -fs localhost:10000/api/health && break; sleep 2; done
          curl -fs localhost:10000/api/health | grep '"status":"ok"'
          curl -fs localhost:10000/ | grep -q '<div id="root">'
          docker logs p | tail -5
