name: Daily digest + benchmark

# Runs every day: answers today's trending topics (Prajna Daily) and re-runs the benchmark,
# commits the results, and publishes the static site to GitHub Pages.
# Add an NVIDIA_API_KEY repository secret to switch from extractive mode to full NVIDIA NIM answers.

on:
  schedule:
    - cron: "17 11 * * *"        # 11:17 UTC daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/daily.yml", "backend/scripts/daily_digest.py", "backend/eval/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      CONTACT_EMAIL: pateldixit28603@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt

      - name: Prajna Daily — answer today's trending topics
        working-directory: backend
        run: python -m scripts.daily_digest --wiki 4 --hn 3

      - name: Benchmark
        working-directory: backend
        run: python -m eval.run_eval

      - name: Commit results
        run: |
          git config user.name "prajna-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DIGEST.md EVAL.md digest site backend/eval/results
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Daily digest + benchmark $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done

      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  pages:
    needs: run
    runs-on: ubuntu-latest
    continue-on-error: true        # stays green even before Pages is switched on for the repo
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - id: deploy
        uses: actions/deploy-pages@v4
