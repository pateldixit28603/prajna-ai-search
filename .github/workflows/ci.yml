name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t prajna .
      - name: Smoke test (container serves UI + API on $PORT)
        run: |
          docker run -d --name p -e PORT=10000 -p 10000:10000 prajna
          ok=""
          for i in $(seq 1 30); do if curl -fs localhost:10000/api/health > health.json; then ok=1; break; fi; sleep 2; done
          docker logs p 2>&1 | tail -20
          test -n "$ok"
          cat health.json; grep -q '"status":"ok"' health.json
          curl -fs localhost:10000/ > index.html
          grep -q 'id="root"' index.html
