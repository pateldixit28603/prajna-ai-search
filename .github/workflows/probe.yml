name: NVIDIA model probe

# Diagnostics: how the configured NIM chat models respond to different "thinking" settings.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install httpx numpy
      - working-directory: backend
        run: python -m scripts.llm_probe
      - run: |
          git config user.name "prajna-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/eval/results/llm_probe.json
          git diff --cached --quiet || git commit -m "NVIDIA model probe results"
          # generated files: on conflict keep this run's fresh output (-X theirs = our commit during rebase)
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep 5
          done
          echo "::error::could not push results"; exit 1
